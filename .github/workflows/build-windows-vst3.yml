name: Build Windows VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --target SteveSledgeCompressor_VST3 --parallel

      - name: Locate VST3
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter "*.vst3" | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: SteveSledge-Multiband-Compressor-Windows-x64-VST3
          path: build/SteveSledgeCompressor_artefacts/Release/VST3/**
          if-no-files-found: error
